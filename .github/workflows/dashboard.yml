# M1 dashboard runner (D9 plan). GitHub Actions is the ONE primary runner -- a local cron is
# never the system of record here. This workflow: harvests the three watched repositories into
# this repository's own `metrics-data` branch (reusing the root `action.yml`, never
# re-implementing its accept/reject logic here), records a heartbeat for the freshness panel,
# generates the static dashboard from that same branch's store + aggregates, and deploys it to
# GitHub Pages -- failing loudly rather than silently succeeding with nothing harvested or
# nothing rendered.
#
# Every third-party action below is pinned to a commit SHA (never a mutable tag) -- resolved
# from each action's own vX tag at the time this workflow was written; the `# vX` comment is
# only a human-readable label, not what actually pins the version.
name: agent-metrics-dashboard

on:
  schedule:
    - cron: "0 3 * * *" # daily -- see README's "Scheduling" note; exact time is not load-bearing
  workflow_dispatch: {}

concurrency:
  group: agent-metrics-dashboard
  cancel-in-progress: false # let an in-flight run finish; never overlap two metrics-data writers

permissions:
  contents: read

env:
  # Defined once so the harvest step's `repos:` input and the "fail on an empty repo list" guard
  # below can never silently drift apart from each other.
  WATCHED_REPOS: |
    shiki-yusuke/spec-lane
    shiki-yusuke/agent-metrics-harvester
    shiki-yusuke/ai-agent-skills-playbook
    shiki-yusuke/agent-cost
    shiki-yusuke/evidence-docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the harvester's store + aggregates to this repo's `metrics-data` branch
    steps:
      - name: Fail fast on an empty repo list
        run: |
          if [ -z "$(echo "$WATCHED_REPOS" | tr -d '[:space:]')" ]; then
            echo "::error::WATCHED_REPOS is empty -- refusing to run a harvest that would trivially succeed over zero repositories." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Install and build (also builds what push-aggregate.mjs and the dashboard CLI import)
        working-directory: repo
        run: |
          npm ci
          npm run build

      - name: Harvest the watched repositories into metrics-data
        id: harvest
        uses: ./repo
        with:
          repos: ${{ env.WATCHED_REPOS }}
          store-path: agent-metrics-store.jsonl
          state-branch: metrics-data
          allowed-logins: shiki-yusuke
          initial-since: "2026-08-01T00:00:00Z" # only used on that repo's first-ever run
          github-token: ${{ secrets.HARVESTER_TOKEN }}

      - name: Record a workflow heartbeat (freshness panel's "pipeline is alive" signal)
        working-directory: repo
        env:
          REPO_SLUG: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"source":"workflow","at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' | \
            node scripts/push-aggregate.mjs \
              --kind heartbeat \
              --repo "$REPO_SLUG" \
              --branch metrics-data

      - name: Check out metrics-data for the dashboard read (post-harvest, post-heartbeat)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: metrics-data
          path: metrics-data-checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the static dashboard
        # Deliberately no `working-directory:` override -- this runs at $GITHUB_WORKSPACE root,
        # so `repo/`, `metrics-data-checkout/`, and `dashboard-dist/` are all same-level
        # siblings and every path below is a plain relative path with no ".." segment.
        # src/cli/path-safety.ts's assertNoPathTraversal rejects ANY ".." segment
        # unconditionally (by design -- see that file), so a `../`-prefixed path here would
        # make agent-metrics-dashboard exit 2 on every scheduled/dispatched run, before Pages
        # ever sees a deploy. test/e2e/dashboard-workflow-args.test.ts pins these exact literal
        # flag values against the real CLI in this same sibling-directory layout -- keep the two
        # in sync if this step's paths ever change.
        run: |
          node repo/dist/src/dashboard/main.js \
            --store jsonl \
            --store-path metrics-data-checkout/agent-metrics-store.jsonl \
            --aggregates-dir metrics-data-checkout/aggregates \
            --out dashboard-dist \
            --empty-reason-config repo/dashboard-empty-reasons.json

      - name: Fail if the dashboard did not actually render all 5 panels
        run: |
          PANEL_COUNT="$(grep -c '<h2>' dashboard-dist/index.html || true)"
          if [ "$PANEL_COUNT" -ne 5 ]; then
            echo "::error::expected exactly 5 panel sections in dashboard-dist/index.html, found ${PANEL_COUNT} -- refusing to deploy a dashboard that silently dropped a panel." >&2
            exit 1
          fi

      # ---- release-evidence deploy adapter (D5, release-evidence/v0) ----
      # Measures dashboard-dist, places release-manifest.json INTO it (so the deployed site
      # carries its own manifest), assembles + seals the evidence bundle, records `prepared`.
      # The evidence job below finishes the ledger after the real deploy. Both checkouts are
      # pinned to commit SHAs, same rule as every action pin in this file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: shiki-yusuke/release-evidence
          ref: b2b1a0169df9cdc07fb3f2ce033a060313bfebbe
          path: release-evidence

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: shiki-yusuke/ai-agent-skills-playbook
          ref: 1b9551254768ce0d4e272855ed29a2802ad37edb
          path: playbook

      - name: Build the release-evidence CLI
        working-directory: release-evidence
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble and seal the Release Evidence Bundle (records `prepared`)
        working-directory: repo
        env:
          RELEASE_EVIDENCE_CONTRACTS_DIR: ${{ github.workspace }}/playbook/contracts/release-evidence/v0
        run: |
          node scripts/release-evidence-glue.mjs assemble \
            --re "$GITHUB_WORKSPACE/release-evidence" \
            --site "$GITHUB_WORKSPACE/dashboard-dist" \
            --repo "${{ github.repository }}" \
            --commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --recipe-file .github/workflows/dashboard.yml \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --out "$GITHUB_WORKSPACE/evidence-out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-out
          path: evidence-out
          retention-days: 7

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: upload
        with:
          path: dashboard-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

  evidence:
    # Finishes the release-evidence ledger AFTER the real deploy: reads release-manifest.json
    # back from the LIVE Pages URL, verifies it against the sealed bundle (wrapper shape, JCS
    # content digest, one content spot-check), records `deployed` (preview_skipped -- Pages has
    # no preview tier) and `verified` -- or `failed(verification)` and a red job when the live
    # site does not match what was sealed. The ledger and bundle are then persisted to the
    # metrics-data branch so the evidence outlives the run.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the ledger + bundle to metrics-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: shiki-yusuke/release-evidence
          ref: b2b1a0169df9cdc07fb3f2ce033a060313bfebbe
          path: release-evidence

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: shiki-yusuke/ai-agent-skills-playbook
          ref: 1b9551254768ce0d4e272855ed29a2802ad37edb
          path: playbook

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build the release-evidence CLI
        working-directory: release-evidence
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-out
          path: evidence-out

      - name: Read back from the live site and finish the ledger
        env:
          RELEASE_EVIDENCE_CONTRACTS_DIR: ${{ github.workspace }}/playbook/contracts/release-evidence/v0
        run: |
          node repo/scripts/release-evidence-glue.mjs finalize \
            --re "$GITHUB_WORKSPACE/release-evidence" \
            --out evidence-out \
            --page-url "${{ needs.deploy.outputs.page_url }}"

      - name: Persist the ledger + bundle to metrics-data
        if: always() # a failed verification is evidence too -- persist it either way
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin metrics-data
          git worktree add ../metrics-data-wt metrics-data
          mkdir -p ../metrics-data-wt/release-evidence/bundles
          BUNDLE_DIGEST="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../evidence-out/outputs.json","utf8")).bundle_digest.slice(7,23))')"
          cp ../evidence-out/bundle.json "../metrics-data-wt/release-evidence/bundles/bundle-${BUNDLE_DIGEST}.json"
          cp ../evidence-out/toolchain.txt "../metrics-data-wt/release-evidence/bundles/toolchain-${BUNDLE_DIGEST}.txt"
          cat ../evidence-out/release-events.jsonl >> ../metrics-data-wt/release-evidence/release-events.jsonl
          cd ../metrics-data-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-evidence
          git commit -m "release-evidence: ledger + bundle for run ${{ github.run_id }}-${{ github.run_attempt }}"
          git push origin metrics-data

  notify:
    # Runs only when both `build` and `deploy` succeeded (a job's default `if` already requires
    # every job in `needs` to have succeeded) -- a dead-man ping fires on SUCCESS, never on
    # failure; its absence (Healthchecks.io-style) is what signals "the scheduled run itself
    # stopped happening," which this workflow's own internal failure states can't detect.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dead-man ping
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "::warning::dead-man ping unset -- HEALTHCHECK_URL secret not configured, skipping (see README's dashboard setup section)"
            exit 0
          fi
          curl -fsS -m 10 "$HEALTHCHECK_URL"
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
